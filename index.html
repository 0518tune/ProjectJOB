<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectJOB — 인생 직업 체험 샌드박스</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2.5' y='7' width='19' height='13' rx='2'/%3E%3Cpath d='M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7M2.5 13h19'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <style>
    /* ---------- 픽셀 폰트 시스템 (Neo둥근모) + 가시성 전면 개편 ---------- */
    @font-face {
      font-family: 'NeoDunggeunmo';
      src: url('https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/neodgm.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Galmuri11';
      src: url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/Galmuri11.woff2') format('woff2');
      font-weight: normal; font-style: normal; font-display: swap;
    }
    /* 루트 폰트 19px = Tailwind rem 단위 전체 1.19배 확대 (가시성 규칙) */
    html { font-size: 19px; }
    body {
      font-family: 'NeoDunggeunmo', 'Galmuri11', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      letter-spacing: .03em; line-height: 1.75;
    }
    /* 픽셀 폰트 faux-bold 뭉개짐 방지: 합성 볼드 차단(단일 웨이트 유지 → 항상 또렷) */
    * { font-synthesis: none; }
    /* JS가 생성하는 고정 px 유틸까지 최소 1.2배 확대 */
    .text-\[9px\]  { font-size: 11.5px !important; }
    .text-\[10px\] { font-size: 12.5px !important; }
    .text-\[11px\] { font-size: 14px !important; }
    .leading-relaxed { line-height: 1.9 !important; }
    .leading-snug, .leading-tight { line-height: 1.55 !important; }

    /* ---------- 16:9 시네마틱 게임 셸 ---------- */
    body {
      min-height: 100vh; margin: 0; padding: 14px;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 0%, #273449 0%, #0f172a 70%);
    }
    #game-shell {
      width: min(96vw, 168vh, 1400px);
      aspect-ratio: 16 / 9; max-height: 95vh;
      display: flex; flex-direction: column; overflow: hidden;
      border-radius: 1.5rem; background: #f1f5f9; position: relative;
      box-shadow: 0 0 0 3px rgba(148,163,184,.35), 0 34px 90px rgba(0,0,0,.65);
    }
    #game-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
    @media (max-width: 680px) {
      body { padding: 0; }
      #game-shell { width: 100vw; height: 100vh; max-height: none; aspect-ratio: auto; border-radius: 0; }
    }

    /* ---------- 공용 애니메이션 ---------- */
    @keyframes wobble { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    .wobble { display: inline-block; animation: wobble 0.9s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .45s ease both; }
    @keyframes shakeX { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px) rotate(-4deg); } 40% { transform: translateX(6px) rotate(3deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
    .anim-shake { animation: shakeX .55s ease both; }
    @keyframes glowPulse {
      0% { filter: drop-shadow(0 0 0 rgba(251,191,36,0)); transform: scale(1); }
      40% { filter: drop-shadow(0 0 18px rgba(251,191,36,.95)); transform: scale(1.15); }
      100% { filter: drop-shadow(0 0 0 rgba(251,191,36,0)); transform: scale(1); }
    }
    .anim-glow { animation: glowPulse .9s ease both; }
    @keyframes popIn { 0% { transform: scale(1); } 40% { transform: scale(1.1) rotate(3deg); } 100% { transform: scale(1); } }
    .anim-pop { animation: popIn .5s ease both; }

    /* ---------- 화면 전환 FX ---------- */
    #screen-fx { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
    @keyframes flashAnim { 0% { background: rgba(255,255,255,0); } 25% { background: rgba(255,255,255,.95); } 100% { background: rgba(255,255,255,0); } }
    .fx-flash { animation: flashAnim .55s ease both; }
    @keyframes dimAnim { 0% { background: rgba(15,23,42,0); } 40% { background: rgba(15,23,42,.45); } 100% { background: rgba(15,23,42,0); } }
    .fx-dim { animation: dimAnim .45s ease both; }

    /* ---------- 타자기 커서 ---------- */
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    .type-caret { display: inline-block; width: 2px; height: 1em; background: #6366f1; margin-left: 2px; vertical-align: -2px; animation: blink .7s step-end infinite; }

    /* ---------- 광고 목업 ---------- */
    @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    .ad-shimmer { background: linear-gradient(110deg, #6366f1, #ec4899, #f59e0b, #6366f1); background-size: 200% 100%; animation: shimmer 3s linear infinite; }

    /* ---------- 삼갈래길 3D 스테이지 ---------- */
    .road-stage {
      /* 뷰포트가 짧을 때(가로로 넓지만 세로가 좁은 창 등) #game-shell 자체가 16:9/95vh
       * 제약으로 낮아져, 고정 400px 캔버스가 셸 바깥으로 밀려나 위쪽만 겨우 보이고
       * 캐릭터가 통째로 잘려 보이던 근본 원인이 여기였다. 뷰포트 높이에 비례해 줄어들게
       * 바꿔 어떤 창 크기에서도 3D 씬 전체가 셸 안에 들어오게 한다(3D 카메라/라벨 시스템은
       * 어떤 픽셀 크기가 주어져도 ResizeObserver로 스스로 맞춘다).
       */
      position: relative; height: clamp(220px, 42vh, 400px); border-radius: 1.5rem; overflow: hidden;
      background: linear-gradient(180deg, #bfe4f2 0%, #e7f2e2 36%, #b3d495 40%, #9ac47c 100%);
      box-shadow: inset 0 -14px 30px rgba(0,0,0,.12);
    }
    @keyframes cloudDrift { from { transform: translateX(-12px); } to { transform: translateX(26px); } }
    @keyframes npcBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    /* 3D 캔버스 위에 투영 좌표로 얹히는 직업 정보 라벨 (기존 road-plate/path-badge 재사용)
     * transform은 매 프레임 JS가 직접 설정(위치+포커스 스케일)하므로 여기서는 건드리지 않고,
     * opacity(포커스 아닌 노드 반투명 처리)만 부드럽게 전환한다. */
    .road-3d-label {
      position: absolute; top: 0; left: 0; z-index: 5; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      transform-origin: bottom center;
      transition: filter .15s ease, opacity .2s ease;
    }
    .road-3d-label:hover { filter: brightness(1.05); }
    /* 갈림길 직업 카드 — 원경에서도 한눈에 읽히도록 크고 두툼하게 */
    .road-plate {
      background: #fffaf1; border: 2.5px solid; border-radius: 15px;
      padding: 7px 13px 8px; text-align: center;
      box-shadow: 0 4px 0 rgba(122,84,50,.42), 0 9px 20px rgba(0,0,0,.22);
      min-width: 152px; max-width: 210px;
      transition: box-shadow .15s ease, transform .15s ease;
    }
    .path-badge {
      color: #fff; font-size: 12px; font-weight: 900; padding: 3px 13px; border-radius: 999px;
      box-shadow: 0 3px 9px rgba(0,0,0,.32); animation: npcBob 1.4s ease-in-out infinite;
      margin-bottom: 4px; white-space: nowrap; border: 2px solid rgba(255,255,255,.85);
    }
    /* 선택된 길에만 나타나는 입장 버튼 — "여기를 누르면 들어간다"를 명시한다 */
    .road-enter {
      display: none; margin-top: 6px; padding: 4px 0;
      font-size: 12.5px; font-weight: 900; color: #fff;
      background: #6fa85c; border-radius: 10px; box-shadow: 0 2px 0 #4e8642;
    }
    .road-3d-label-sel .road-enter { display: block; }
    .road-3d-label-sel .road-plate {
      box-shadow: 0 0 0 3px #e8a33d, 0 5px 0 rgba(122,84,50,.42), 0 12px 24px rgba(0,0,0,.28);
    }
    .road-3d-label:hover .road-plate { transform: translateY(-2px); }

    /* 잡보드 컨트롤 버튼 — 작고 흐릿하던 것을 눌리는 나무 버튼으로 */
    .board-btn {
      font-size: 13px; font-weight: 900; padding: 9px 16px; border-radius: 13px;
      border: 2px solid var(--wood-dark); white-space: nowrap;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .board-btn:hover { transform: translateY(-2px); }
    .board-btn:active { transform: translateY(3px); box-shadow: none !important; }
    .board-btn-leaf  { background: var(--leaf); color: #fff; border-color: var(--leaf-dark); box-shadow: 0 4px 0 var(--leaf-dark); }
    .board-btn-leaf:hover { background: #7ab868; }
    .board-btn-honey { background: var(--honey); color: #fff; box-shadow: 0 4px 0 var(--wood-dark); }
    .board-btn-honey:hover { background: #d18e2b; }
    .board-btn-ghost { background: var(--paper); color: var(--ink-1); box-shadow: 0 4px 0 var(--wood); }
    .board-btn-ghost:hover { background: #fff4de; }
    .road-hint {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      z-index: 10; pointer-events: none; white-space: nowrap;
      font-size: 12.5px; font-weight: 700; color: #fffaf1;
      background: rgba(58,40,26,.72); border: 1.5px solid rgba(246,230,200,.4);
      padding: 5px 16px; border-radius: 999px;
    }
    @media (max-width: 560px) {
      /* 카드를 통째로 줄이기보다 문구를 줄여 폭을 확보한다 (글자 크기는 지킨다) */
      .road-plate { min-width: 104px; padding: 6px 10px 7px; }
      .road-plate .ep-word { display: none; }
      .path-badge { font-size: 11px; padding: 2px 9px; }
      .road-hint { font-size: 10.5px; padding: 4px 10px; }
      .board-btn { font-size: 12px; padding: 8px 12px; }
    }

    /* ---------- 정면 뷰 룸 빌더 ---------- */
    #room-2d {
      position: relative; height: 330px; border-radius: 1.25rem; overflow: hidden;
      box-shadow: inset 0 0 24px rgba(0,0,0,.12); transition: transform .24s ease, opacity .24s ease, height .3s ease;
      touch-action: none;
    }
    .room-wall { position: absolute; inset: 0 0 24%; }
    .room-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; }
    .room-baseboard { position: absolute; left: 0; right: 0; bottom: 24%; height: 5px; background: rgba(0,0,0,.22); }
    .room-item {
      position: absolute; transform: translate(-50%,-50%); font-size: 38px; line-height: 1;
      cursor: grab; user-select: none; z-index: 5;
      filter: drop-shadow(2px 5px 4px rgba(0,0,0,.35));
      transition: transform .12s ease;
    }
    .room-item:hover { transform: translate(-50%,-56%) scale(1.1); }
    .room-item.dragging { cursor: grabbing; transform: translate(-50%,-50%) scale(1.18); z-index: 20; opacity: .9; }
    .room-item.collide-shake { animation: shakeX .55s ease both; }
    .room-rot-out { transform: perspective(900px) rotateY(88deg); opacity: .25; }
    .room-rot-in { animation: rotIn .26s ease both; }
    @keyframes rotIn { from { transform: perspective(900px) rotateY(-88deg); opacity: .25; } to { transform: perspective(900px) rotateY(0); opacity: 1; } }

    /* ---------- 전문 용어 하이라이트 & 툴팁 ---------- */
    .term { color: #7c3aed; font-weight: 800; border-bottom: 1.5px dashed #c4b5fd; cursor: help; border-radius: 3px; transition: background .15s ease; }
    .term:hover { background: #ede9fe; color: #6d28d9; }
    #term-tip { transition: opacity .15s ease; }
    #term-tip b { color: #c4b5fd; display: block; margin-bottom: 3px; font-size: 14px; }

    /* ---------- NPC 동석 & 피드백 연출 ---------- */
    @keyframes bubblePop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
    .bubble-pop { animation: bubblePop .38s ease both; }
    .npc-bubble { position: relative; }
    .npc-bubble::before {
      content: ''; position: absolute; top: -8px; left: 30px;
      border: 8px solid transparent; border-top: none; border-bottom-color: inherit;
    }
    .stat-chip { animation: fadeUp .4s ease both; }

    /* ---------- 성향 스탯 바 ---------- */
    @keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .trait-bar { transform-origin: left center; animation: barGrow .7s ease both; }

    /* ---------- 명예의 전당 (황금빛 네온 이펙트) ---------- */
    @keyframes goldNeon {
      0%, 100% { box-shadow: 0 0 0 1px #fde68a, 0 0 10px rgba(251,191,36,.35), inset 0 0 12px rgba(253,230,138,.3); }
      50% { box-shadow: 0 0 0 2px #fbbf24, 0 0 24px rgba(251,191,36,.8), inset 0 0 18px rgba(253,230,138,.55); }
    }
    .rank-card {
      background: #fff; border: 2px solid #fcd34d;
      animation: goldNeon 2.2s ease-in-out infinite;
      transition: transform .15s ease;
    }
    .rank-card:hover { transform: translateY(-3px); }

    /* ---------- 감성 오프닝 시퀀스 ---------- */
    #opening { background: #a9c4bd; }
    #opening .op-cloud { position: absolute; font-size: 46px; opacity: .5; animation: cloudDrift 11s ease-in-out infinite alternate; }
    #opening .op-dot { position: absolute; background: #fff; border-radius: 50%; animation: opTwk 3.2s ease-in-out infinite; }
    @keyframes opTwk { 0%,100% { opacity: .08; } 50% { opacity: .55; } }
    @keyframes opIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes opOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }
    .op-in { animation: opIn 1s ease both; }
    .op-out { animation: opOut 1s ease both; }
    #opening-line::after { content: '▌'; margin-left: 2px; animation: blink .6s step-end infinite; }
    #opening-line.op-done::after { content: ''; }

    /* ---------- 아이템 카드 입체감 (인벤토리 / 방 아이템) ---------- */
    .item-card-glow { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .item-card-furniture { box-shadow: 0 2px 10px rgba(56,189,248,.15); }
    .item-card-furniture:hover, button.item-card-furniture:focus-visible { border-color: #7dd3fc !important; box-shadow: 0 6px 18px rgba(14,165,233,.35); transform: translateY(-3px) scale(1.03); }
    .item-card-decor { box-shadow: 0 2px 10px rgba(244,114,182,.15); }
    .item-card-decor:hover, button.item-card-decor:focus-visible { border-color: #f9a8d4 !important; box-shadow: 0 6px 18px rgba(236,72,153,.35); transform: translateY(-3px) scale(1.03); }
    .room-item.item-card-furniture { filter: drop-shadow(2px 5px 4px rgba(0,0,0,.35)) drop-shadow(0 0 7px rgba(56,189,248,.45)); }
    .room-item.item-card-decor { filter: drop-shadow(2px 5px 4px rgba(0,0,0,.35)) drop-shadow(0 0 7px rgba(244,114,182,.5)); }

    /* ---------- 에피소드 진행률 바 반짝임 ---------- */
    .ep-progress-fill { position: relative; overflow: hidden; }
    .ep-progress-fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
      background-size: 200% 100%; animation: shimmer 2.2s ease-in-out infinite;
    }

    /* ---------- 선택지 hover/클릭 연출 ---------- */
    .choice-btn { position: relative; overflow: hidden; }
    .choice-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,.16); }
    .choice-btn .ripple {
      position: absolute; border-radius: 50%; background: rgba(99,102,241,.35);
      transform: scale(0); animation: rippleAnim .55s ease-out forwards; pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(2.6); opacity: 0; } }
    @keyframes choiceSelectedPop {
      0% { transform: scale(1); }
      30% { transform: scale(.92); box-shadow: 0 0 0 3px rgba(99,102,241,.45); }
      62% { transform: scale(1.05); }
      100% { transform: scale(1); box-shadow: 0 0 0 3px rgba(99,102,241,.45); }
    }
    .choice-selected { animation: choiceSelectedPop .4s cubic-bezier(.34,1.56,.64,1) both; border-color: #6366f1 !important; background: #eef2ff !important; }

    /* ---------- 스탯/보상 둥실 팝업 ---------- */
    @keyframes floatUpFade {
      0% { transform: translate(-50%, 0) scale(.7); opacity: 0; }
      15% { transform: translate(-50%, -8px) scale(1.18); opacity: 1; }
      78% { transform: translate(-50%, -38px) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -58px) scale(.94); opacity: 0; }
    }
    .stat-float {
      position: absolute; left: 50%; top: 0; z-index: 30; pointer-events: none;
      font-weight: 900; font-size: 14px; white-space: nowrap;
      text-shadow: 0 2px 6px rgba(0,0,0,.3);
      animation: floatUpFade 1.15s cubic-bezier(.2,.7,.3,1) both;
    }

    /* ---------- 즉각 결과 배너 (1.5초 노출) ---------- */
    @keyframes burstIn {
      0% { transform: translate(-50%,-50%) scale(.4) rotate(-3deg); opacity: 0; }
      55% { transform: translate(-50%,-50%) scale(1.08) rotate(1deg); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 1; }
    }
    @keyframes burstOut { to { transform: translate(-50%,-50%) scale(.85); opacity: 0; } }
    .result-burst {
      position: absolute; left: 50%; top: 42%; z-index: 40; pointer-events: none;
      padding: 8px 20px; border-radius: 16px; text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,.35); color: #fff;
      animation: burstIn .38s cubic-bezier(.34,1.56,.64,1) both;
    }
    .result-burst.result-burst-out { animation: burstOut .28s ease both; }
    .result-burst .rb-title { font-size: 11px; font-weight: 900; opacity: .92; margin-bottom: 1px; letter-spacing: .02em; }
    .result-burst .rb-detail { font-size: 17px; font-weight: 900; }

    /* ---------- 게임 셸 전체 흔들림 (드라마틱 모먼트) ---------- */
    .shell-shake { animation: shakeX .5s ease both; }

    /* ═══════════════════════════════════════════════════════════════
       ★ 코지 테마 레이어 ★
       ───────────────────────────────────────────────────────────────
       "SaaS 대시보드"처럼 보이던 흰 카드 + indigo/slate 팔레트를
       크림·우드·따뜻한 초록의 라이프 시뮬레이션 톤으로 전면 교체한다.
       Tailwind CDN이 런타임에 유틸리티를 주입하므로 !important로 덮는다.
       (기존 마크업의 클래스명을 그대로 두고 색만 갈아끼우는 방식 —
        app.js가 만들어내는 수백 개의 템플릿 문자열을 건드리지 않는다.)
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --paper:     #fffaf1;   /* 패널 바탕 (종이) */
      --paper-2:   #fbeed7;   /* 옅은 강조 바탕 */
      --cream:     #f6e6c8;   /* 게임 화면 바탕 */
      --wood:      #c49a6c;   /* 나무 테두리 */
      --wood-dark: #9a6b43;   /* 진한 나무 */
      --ink-1:     #4a3524;   /* 본문 글자 */
      --ink-2:     #7d6247;   /* 보조 글자 */
      --ink-3:     #a68a68;   /* 흐린 글자 */
      --leaf:      #6fa85c;   /* 메인 악센트 (따뜻한 초록) */
      --leaf-dark: #4e8642;
      --leaf-soft: #e4f0d8;
      --honey:     #e8a33d;   /* 보조 악센트 (꿀빛) */
      --berry:     #e0798f;   /* 경고/감정 */
      --sky:       #7cb8d4;
    }

    /* ── 바깥 배경: 차가운 남색 → 해질녘 나무 톤 ── */
    body { background: radial-gradient(ellipse at 50% -10%, #7a5c3c 0%, #4a3526 55%, #34241a 100%); }
    #game-shell {
      background: var(--cream) !important;
      box-shadow: 0 0 0 4px var(--wood-dark), 0 0 0 9px #6f4a2c, 0 34px 90px rgba(0,0,0,.6) !important;
    }
    /* 종이결 텍스처 — 크림 바탕에 아주 옅은 가로 결을 얹어 평평함을 없앤다 */
    #game-scroll {
      background-image: repeating-linear-gradient(0deg, rgba(154,107,67,.035) 0 1px, transparent 1px 4px);
    }

    /* ── 중립(slate) 계열 → 우드/잉크 ── */
    .bg-white, .bg-white\/90, .bg-white\/70 { background-color: var(--paper) !important; }
    .bg-slate-50  { background-color: var(--paper-2) !important; }
    .bg-slate-100 { background-color: #f0dfc2 !important; }
    .bg-slate-200 { background-color: #e3cda8 !important; }
    .bg-slate-700, .bg-slate-800 { background-color: var(--wood-dark) !important; }
    .hover\:bg-slate-100:hover { background-color: #f0dfc2 !important; }
    .hover\:bg-slate-200:hover { background-color: #e3cda8 !important; }
    .hover\:bg-slate-700:hover { background-color: #7d5535 !important; }
    .text-slate-800, .text-slate-700 { color: var(--ink-1) !important; }
    .text-slate-600, .text-slate-500 { color: var(--ink-2) !important; }
    .text-slate-400, .text-slate-300 { color: var(--ink-3) !important; }
    .border-slate-100 { border-color: #ecd9b8 !important; }
    .border-slate-200 { border-color: var(--wood) !important; }
    .hover\:border-slate-300:hover { border-color: var(--wood-dark) !important; }

    /* ── indigo(브랜드 색) → 잎사귀 초록 ── */
    .bg-indigo-600 { background-color: var(--leaf) !important; }
    .hover\:bg-indigo-700:hover { background-color: var(--leaf-dark) !important; }
    .bg-indigo-50, .bg-indigo-50\/50, .hover\:bg-indigo-50\/50:hover { background-color: var(--leaf-soft) !important; }
    .bg-indigo-100, .group-hover\:bg-indigo-200 { background-color: #cfe4bd !important; }
    .text-indigo-600, .text-indigo-500, .text-indigo-400 { color: var(--leaf-dark) !important; }
    .border-indigo-100 { border-color: #cfe4bd !important; }
    .border-indigo-300, .hover\:border-indigo-300:hover,
    .focus\:border-indigo-300:focus { border-color: var(--leaf) !important; }
    .accent-indigo-600 { accent-color: var(--leaf) !important; }
    .choice-selected { border-color: var(--leaf) !important; background: var(--leaf-soft) !important; }
    .type-caret { background: var(--leaf-dark); }

    /* indigo 잔여분 (진행 바·강조 테두리 등) */
    .bg-indigo-700, .bg-indigo-500 { background-color: var(--leaf-dark) !important; }
    .border-indigo-200 { border-color: #cfe4bd !important; }
    .border-indigo-500 { border-color: var(--leaf-dark) !important; }
    .text-indigo-700, .text-indigo-800 { color: #3f6f36 !important; }
    .from-indigo-50, .to-indigo-50 { --tw-gradient-from: var(--leaf-soft) !important; --tw-gradient-to: var(--leaf-soft) !important; }

    /* ── violet(보조 기능 계열) → 꿀빛, sky(정보 계열) → 차분한 청록 ── */
    .bg-violet-500, .bg-violet-600, .to-violet-600 { background-color: #c98a3c !important; }
    .hover\:bg-violet-600:hover { background-color: #ad7328 !important; }
    .bg-violet-50 { background-color: #fdf0d5 !important; }
    .border-violet-200, .border-violet-300 { border-color: #eccb8e !important; }
    .text-violet-500, .text-violet-600 { color: #a86f24 !important; }
    .from-violet-50 { --tw-gradient-from: #fdf0d5 !important; }
    .bg-sky-100 { background-color: #d9ecf2 !important; }
    .text-sky-600, .text-sky-500 { color: #40819a !important; }
    .border-sky-200 { border-color: #a8cfdd !important; }
    .hover\:bg-sky-50:hover { background-color: #eaf5f8 !important; }

    /* ── 나머지 악센트를 크림 배경에 맞게 살짝 눅여준다 ── */
    .bg-amber-50  { background-color: #fdf0d5 !important; }
    .bg-amber-400 { background-color: var(--honey) !important; }
    .hover\:bg-amber-500:hover { background-color: #d18e2b !important; }
    .border-amber-200 { border-color: #eccb8e !important; }
    .text-amber-600, .text-amber-500 { color: #b97d22 !important; }
    .bg-emerald-500 { background-color: var(--leaf) !important; }
    .hover\:bg-emerald-600:hover { background-color: var(--leaf-dark) !important; }
    .bg-emerald-100 { background-color: var(--leaf-soft) !important; }
    .text-emerald-600, .text-emerald-500 { color: var(--leaf-dark) !important; }
    .bg-rose-100 { background-color: #fbe0e4 !important; }
    .text-rose-500, .text-rose-400 { color: #cf5f77 !important; }
    .border-rose-200 { border-color: #f0bcc6 !important; }

    /* ── 패널: 평평한 흰 카드 → 두툼한 나무 액자 ── */
    .rounded-3xl.shadow-sm, .rounded-2xl.shadow-sm {
      border: 2px solid var(--wood) !important;
      box-shadow: 0 3px 0 #d9b98c, 0 8px 18px rgba(122,84,50,.18) !important;
    }
    #modal-content {
      border: 3px solid var(--wood-dark);
      box-shadow: 0 6px 0 var(--wood), 0 26px 50px rgba(0,0,0,.4);
    }
    #modal-backdrop { background: rgba(74,53,38,.6) !important; }
    #toast {
      background: var(--wood-dark) !important;
      box-shadow: 0 4px 0 #6f4a2c, 0 10px 24px rgba(0,0,0,.35) !important;
    }
    #term-tip { background: rgba(74,53,38,.96) !important; }
    #term-tip b { color: #f0d49a !important; }
    .term { color: var(--leaf-dark); border-bottom-color: #a8cf94; }
    .term:hover { background: var(--leaf-soft); color: var(--leaf-dark); }

    /* ── HUD 헤더 ── */
    .hud-bar {
      background: linear-gradient(180deg, #fff8ea, #f6e6c8) !important;
      border-bottom: 3px solid var(--wood) !important;
      box-shadow: 0 3px 0 rgba(154,107,67,.25);
    }
    .hud-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--paper); border: 2px solid var(--wood);
      border-radius: 999px; padding: 4px 12px;
      font-weight: 700; color: var(--ink-1); white-space: nowrap;
      box-shadow: 0 2px 0 var(--wood);
    }
    .hud-btn {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--paper); border: 2px solid var(--wood);
      box-shadow: 0 3px 0 var(--wood);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-2); transition: transform .12s ease, box-shadow .12s ease;
    }
    .hud-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--wood-dark); color: var(--ink-1); }
    .hud-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--wood); }

    /* ── 메뉴 탭: 앱 탭바 → 나무 책갈피 ── */
    .tab-btn {
      background: #e8d3ae !important;
      color: var(--ink-2) !important;
      border: 2px solid var(--wood) !important;
      border-bottom-width: 0 !important;
      border-radius: 14px 14px 0 0 !important;
      box-shadow: inset 0 -6px 10px rgba(154,107,67,.18);
      padding: 10px 4px !important;
      transition: transform .12s ease, background .12s ease;
    }
    .tab-btn::after { display: none !important; }
    .tab-btn:hover { background: #f0e0c2 !important; transform: translateY(-2px); }
    .tab-btn.tab-on {
      background: var(--paper) !important;
      color: var(--leaf-dark) !important;
      box-shadow: inset 0 4px 0 var(--leaf), 0 -3px 10px rgba(154,107,67,.12);
      transform: translateY(-3px);
    }
    .tab-rail { border-bottom: 3px solid var(--wood); }
    /* 좁은 화면에서는 아이콘을 위, 이름을 아래로 — 글자가 세로로 쪼개지지 않게 한다 */
    @media (max-width: 560px) {
      .tab-btn { flex-direction: column !important; gap: 1px !important; padding: 6px 2px !important; }
      .tab-btn span { white-space: nowrap; }
      .tab-btn span:last-child { font-size: 10.5px; }
    }

    /* ── 시네마틱 대화 무대 ── */
    .cine-stage {
      position: relative; overflow: hidden;
      border-radius: 18px 18px 0 0;
      background: linear-gradient(180deg, #cfe6f3 0%, #f2e0c0 62%, #e3c79c 100%);
      box-shadow: inset 0 -18px 30px rgba(120,84,50,.18);
    }
    .cine-vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(74,53,38,.35) 100%);
    }
    .cine-letterbox { position: absolute; left: 0; right: 0; height: 14px; background: rgba(58,40,26,.82); pointer-events: none; }
    .cine-letterbox.top { top: 0; } .cine-letterbox.bottom { bottom: 0; }
    /* 화자 이름표는 무대 위쪽에 둔다 — 아래쪽은 대화 상자가 겹쳐 올라온다 */
    .cine-nameplate {
      position: absolute; z-index: 6; top: 22px;
      font-size: 12px; font-weight: 800; color: #fff;
      padding: 3px 12px; border-radius: 999px;
      border: 2px solid rgba(255,255,255,.75);
      box-shadow: 0 3px 8px rgba(0,0,0,.32);
    }
    /* 하단 대화 상자 — 무대 위로 살짝 올라탄다 */
    .dialogue-box {
      position: relative; z-index: 8; margin-top: -18px;
      background: var(--paper);
      border: 3px solid var(--wood-dark);
      border-radius: 18px;
      box-shadow: 0 5px 0 var(--wood), 0 14px 26px rgba(122,84,50,.25);
      padding: 14px 16px 12px;
    }
    .dialogue-speaker {
      position: absolute; top: -15px; left: 16px;
      font-size: 12px; font-weight: 900; color: #fff;
      padding: 3px 14px; border-radius: 999px;
      border: 2px solid var(--paper);
      box-shadow: 0 3px 0 rgba(122,84,50,.35);
    }
    .cine-hint {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; color: var(--ink-3);
    }
    /* 진행 다음 버튼: 대화창 우하단 삼각 인디케이터 */
    @keyframes nextBlink { 0%,100% { transform: translateY(0); opacity: .55; } 50% { transform: translateY(3px); opacity: 1; } }
    .next-caret { animation: nextBlink 1s ease-in-out infinite; }

    /* ── 타이틀 화면 ── */
    #title-screen {
      position: fixed; inset: 0; z-index: 95; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #fbe9c8 0%, #e6c79d 45%, #c49a6c 100%);
      overflow: hidden; transition: opacity .7s ease;
    }
    /* id 선택자가 Tailwind의 .hidden(0,1,0)을 이기므로 명시적으로 꺼 준다.
     * 이게 없으면 타이틀이 사라진 뒤에도 투명한 채로 화면 위에 남아 클릭을 전부 먹는다. */
    #title-screen.hidden { display: none; }
    #title-screen .t-cloud { position: absolute; font-size: 54px; opacity: .55; animation: cloudDrift 13s ease-in-out infinite alternate; }
    #title-screen .t-hill {
      position: absolute; bottom: -14%; left: 50%; transform: translateX(-50%);
      width: 150%; height: 46%; border-radius: 50% 50% 0 0; background: #8fbb72;
      box-shadow: 0 -8px 0 #a5cd88;
    }
    #title-screen .t-hill.back { bottom: -6%; width: 180%; height: 40%; background: #a5cd88; box-shadow: none; opacity: .85; }
    .title-logo {
      position: relative; z-index: 4; text-align: center;
      color: #fffaf1; font-weight: 900; letter-spacing: .08em;
      text-shadow: 0 4px 0 #9a6b43, 0 8px 18px rgba(74,53,38,.5);
    }
    .title-menu-btn {
      position: relative; z-index: 4; width: min(300px, 74vw);
      background: var(--paper); color: var(--ink-1);
      border: 3px solid var(--wood-dark); border-radius: 16px;
      box-shadow: 0 5px 0 var(--wood-dark);
      font-weight: 900; padding: 12px 18px;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .title-menu-btn:hover { background: #fff4de; transform: translateY(-2px); box-shadow: 0 7px 0 var(--wood-dark); }
    .title-menu-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--wood-dark); }
    .title-menu-btn.primary { background: var(--leaf); color: #fff; border-color: var(--leaf-dark); box-shadow: 0 5px 0 var(--leaf-dark); }
    .title-menu-btn.primary:hover { background: #7ab868; box-shadow: 0 7px 0 var(--leaf-dark); }
    .title-menu-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 5px 0 var(--wood-dark); }

    /* ── 퀘스트 바 & 선택지 카드 ── */
    .quest-bar {
      display: flex; align-items: center; gap: 10px;
      background: linear-gradient(180deg, #fff8ea, #f3e2c4);
      border: 2px solid var(--wood); border-bottom: 3px solid var(--wood);
      border-radius: 16px 16px 0 0; padding: 7px 12px;
    }
    .quest-pill { font-size: 11px; font-weight: 900; color: #fff; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
    .quest-progress { height: 9px; border-radius: 999px; background: #e3cda8; overflow: hidden; border: 1.5px solid var(--wood); }
    .choice-card {
      display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
      background: var(--paper-2); border: 2px solid var(--wood); border-radius: 14px;
      box-shadow: 0 3px 0 var(--wood); padding: 9px 12px;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .choice-card:hover { background: #fff4de; transform: translateY(-2px); box-shadow: 0 5px 0 var(--wood-dark); }
    .choice-card:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood); }
    .choice-card:disabled { opacity: .45; }
    .choice-num {
      flex-shrink: 0; width: 23px; height: 23px; border-radius: 8px;
      background: var(--leaf); color: #fff; font-weight: 900; font-size: 12px;
      display: flex; align-items: center; justify-content: center; margin-top: 1px;
      box-shadow: 0 2px 0 var(--leaf-dark);
    }
    .stage-btn {
      background: rgba(58,40,26,.72); color: #f6e6c8; border: 1.5px solid rgba(246,230,200,.5);
      border-radius: 9px; font-size: 11px; font-weight: 800; padding: 3px 9px;
      transition: background .12s ease;
    }
    .stage-btn:hover { background: rgba(58,40,26,.92); }
    .stage-btn.on { background: var(--honey); color: #3a281a; border-color: #fff2d4; }

    /* ── 기획 패널 (연출 큐시트 · 퀘스트 데이터 · 에피소드 흐름) ── */
    .dir-note {
      background: #3a281a; color: #f0d49a; border-radius: 12px;
      border: 2px solid #6f4a2c; padding: 8px 10px;
      font-size: 11px; line-height: 1.65;
    }
    .dir-note b { color: #ffe6ae; }
    .dir-note .dir-cue { color: #cfe4bd; }
    .dir-note .dir-t { color: #e8a33d; font-weight: 900; }

    .dn-tabs { display: flex; gap: 4px; margin-bottom: 7px; flex-wrap: wrap; align-items: center; }
    .dn-tab {
      font-size: 11px; font-weight: 800; padding: 4px 11px; border-radius: 8px;
      background: rgba(246,230,200,.12); color: #e0c79a;
      border: 1px solid rgba(246,230,200,.28); transition: background .12s ease;
    }
    .dn-tab:hover { background: rgba(246,230,200,.24); }
    .dn-tab.on { background: #e8a33d; color: #3a281a; border-color: #ffe6ae; }
    .dn-btn {
      font-size: 11px; font-weight: 900; padding: 4px 11px; border-radius: 8px;
      background: #6fa85c; color: #fff; border: 1px solid #8bc47a; transition: background .12s ease;
    }
    .dn-btn:hover { background: #7ab868; }
    .dn-body { max-height: 200px; overflow: auto; }
    .dn-meta { color: #bda37c; }
    .dn-kv { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .dn-kv span b { color: #ffe6ae; }

    .dn-table { border-collapse: collapse; font-size: 10.5px; white-space: nowrap; }
    .dn-table th {
      position: sticky; top: 0; z-index: 1; background: #4a3524; color: #ffe6ae;
      text-align: left; padding: 4px 8px; border-bottom: 1px solid #6f4a2c; font-weight: 900;
    }
    .dn-table td { padding: 3px 8px; border-bottom: 1px solid rgba(111,74,44,.55); color: #f0d49a; }
    .dn-table tr.dn-now td { background: rgba(232,163,61,.16); }
    .dn-table .dn-num { text-align: right; }
    .dn-pos { color: #cfe4bd; } .dn-neg { color: #f0a3a3; } .dn-zero { color: #7d6a52; }
    .dn-wide { max-width: 148px; overflow: hidden; text-overflow: ellipsis; }

    .dn-flow { display: flex; align-items: stretch; gap: 5px; }
    .dn-node {
      min-width: 116px; background: rgba(246,230,200,.09);
      border: 1.5px solid rgba(246,230,200,.28); border-radius: 9px; padding: 5px 8px;
    }
    .dn-node.dn-now { border-color: #e8a33d; background: rgba(232,163,61,.16); }
    .dn-arrow { align-self: center; color: #e8a33d; font-weight: 900; }
    .dn-end { min-width: 150px; }
    .dn-warn { color: #ffcf8a; } .dn-info { color: #bcd6ad; } .dn-ok { color: #9ec98a; }
  </style>
</head>
<body class="text-slate-800">

     기획자는 위 데이터만 수정하면 됩니다. (아래 코드는 손댈 필요 없음)
     ═══════════════════════════════════════════════════════════════ */
  const JobBinder = {
    /* 점수표 문자열 파서: '성과+2, 스트레스+1, #분석력+2' → effects 객체 */
    parseScore(str) {
      const fx = { performance: 0, stress: 0, patience: 0, traits: {} };
      const R_TRAIT = Object.fromEntries(Object.entries(TRAIT_LABELS).map(([k, v]) => [v, k]));
      String(str || '').split(',').forEach((tok) => {
        const m = tok.trim().match(/^(#?)(.+?)([+-]\d+)$/);
        if (!m) return;
        const [, hash, label, num] = m;
        const n = parseInt(num, 10);
        if (hash) {
          const key = R_TRAIT[label.trim()];
          if (key) fx.traits[key] = (fx.traits[key] || 0) + n;
        } else if (label.trim() === '성과') fx.performance += n;
        else if (label.trim() === '스트레스') fx.stress += n;
        else if (['인내심', '인내', '끈기'].includes(label.trim())) fx.patience += n;
      });
      return fx;
    },
    /* '이모지 이름' → {id, emoji, name} */
    parseReward(str, id) {
      const s = String(str || '🎁 기념품').trim();
      const sp = s.indexOf(' ');
      return { id, emoji: s.slice(0, sp), name: s.slice(sp + 1) };
    },
    /* '이름|설명' → {name, desc} */
    parseTitle(str) {
      const [name, desc] = String(str || '체험자|평범한 하루였다.').split('|');
      return { name: name.trim(), desc: (desc || '').trim() };
    },
    /* 'eco:3, patience:2' → {eco:3, patience:2} */
    parseProfile(str) {
      const o = {};
      String(str || '').split(',').forEach((p) => {
        const [k, v] = p.split(':');
        if (k && v) o[k.trim()] = parseInt(v, 10) || 0;
      });
      return o;
    },
    /* 시나리오 행 → 엔진 시나리오 객체 */
    buildScenario(row) {
      return {
        narration: [row.상황],
        q: row.질문,
        /* 연출 프리셋 ID (js/direction.js의 DIRECTION_PRESETS 키).
         * 비워두면 DirectionPicker가 컷 위치와 선택지 수치(톤)를 보고 자동 배정한다. */
        cue: row.연출 || null,
        choices: ['A', 'B', 'C']
          .filter((k) => row['선택지' + k])
          .map((k) => ({ text: row['선택지' + k], fb: row['피드백' + k], effects: this.parseScore(row['점수' + k]) })),
      };
    },
    /* 직업 1행 → 엔진 잡 오브젝트 */
    build(row) {
      const sc = row.시나리오.slice().sort((a, b) => a.단계 - b.단계).map((r) => this.buildScenario(r));
      const ok = this.parseTitle(row.칭호.성공);
      const alt = this.parseTitle(row.칭호.별종);
      const quit = this.parseTitle(row.칭호.퇴사);
      return {
        id: row.ID, name: row.직업명, emoji: row.이모지,
        emojiSuccess: row.성공이모지, emojiAlt: row.실패이모지,
        color: row.컬러, desc: row.소개,
        traitProfile: this.parseProfile(row.성향프로필),
        modes: { light: { scenarios: sc.slice(0, 3) }, realistic: { scenarios: sc } },
        career: {
          certs: row.커리어.자격증, competition: row.커리어.경쟁률,
          outlook: row.커리어.전망, outlookText: row.커리어.전망설명,
          salary: row.커리어.연봉, interviewTip: row.커리어.면접팁,
        },
        titles: [{ id: row.ID + '_t1', name: ok.name, desc: ok.desc, type: 'success',
          cond: (s, ctx) => s.performance >= ctx.completed * 1.1 && s.stress <= ctx.completed * 1.8 }],
        defaultTitle: { id: row.ID + '_t2', name: alt.name, desc: alt.desc, type: 'alt' },
        quitterTitle: { id: row.ID + '_t3', name: quit.name, desc: quit.desc, type: 'alt' },
        deepCond: (s, ctx) => s.performance >= ctx.completed * 1.5 && s.stress <= ctx.completed * 1.1,
        furniture: this.parseReward(row.보상.가구, row.ID + '_furn'),
        decor: this.parseReward(row.보상.장식, row.ID + '_decor'),
        costume: this.parseReward(row.보상.코스튬, row.ID + '_costume'),
      };
    },
    /* 엔진의 직업 풀(JOBS)을 기획 데이터로 완전 교체 */
    bindAll() {
      const built = JOB_DATABASE.map((r) => this.build(r));
      JOBS.length = 0;
      JOBS.push(...built);
    },
  };
  JobBinder.bindAll();
  </script>

  <!-- ═══════════ 확장 애드온: 오프닝 · 골드 경제 · 커스터마이저 · 충돌 방지 (엔진 무수정) ═══════════ -->
  <script>
    'use strict';

    /* =====================================================
     * A-0. 타이틀 화면 — 오프닝이 끝나면 게임 앞에 세워지는 첫 화면.
     *      "탭을 눌러 시작하는 앱"이 아니라 "메뉴에서 시작하는 게임"이라는
     *      인상을 만드는 장치. 세이브 유무에 따라 메뉴가 달라진다.
     * ===================================================== */
    const TitleScreen = {
      el: null,
      visible: false,

      show() {
        const el = document.getElementById('title-screen');
        if (!el) return;
        this.el = el;
        this.visible = true;
        el.classList.remove('hidden');
        el.style.opacity = '0';
        requestAnimationFrame(() => { el.style.opacity = '1'; });

        const played = Object.keys(SAVE.records || {}).length;
        const hasSave = played > 0 || (SAVE.history || []).length > 0;

        const btnNew = document.getElementById('title-new');
        const btnCont = document.getElementById('title-continue');
        const btnSet = document.getElementById('title-settings');
        const info = document.getElementById('title-save-info');

        btnCont.disabled = !hasSave;
        info.innerHTML = hasSave
          ? `🌱 체험한 직업 ${played}개 · 🪙 ${SAVE.gold}G · 🎒 수집품 ${(SAVE.unlocked || []).length}개`
          : '아직 아무 인생도 살아보지 않았어요. 첫 갈림길이 기다리고 있어요!';

        btnNew.onclick = () => {
          SFX.click();
          if (!hasSave) return this.hide();
          // 기존 기록이 있으면 되돌릴 수 없는 초기화라는 걸 분명히 알린다
          info.innerHTML = '<b style="color:#b3402f">지금까지의 모든 기록이 사라집니다. 정말 새로 시작할까요?</b>';
          btnNew.textContent = '⚠️ 네, 전부 지우고 시작';
          btnNew.onclick = () => { localStorage.clear(); location.reload(); };
        };
        btnCont.onclick = () => { if (!btnCont.disabled) { SFX.click(); this.hide(); } };
        btnSet.onclick = () => { SFX.click(); this.hide(); setTimeout(() => UI.showSettings(), 260); };

        this._key = (e) => {
          if (!this.visible) return;
          if (['Enter', ' '].includes(e.key)) { e.preventDefault(); e.stopPropagation(); (hasSave ? btnCont : btnNew).click(); }
        };
        document.addEventListener('keydown', this._key, true);
      },

      hide() {
        if (!this.el) return;
        this.visible = false;
        document.removeEventListener('keydown', this._key, true);
        this.el.style.opacity = '0';
        setTimeout(() => this.el && this.el.classList.add('hidden'), 700);
        UI.fx('fx-flash');
        // 아직 내 캐릭터가 없으면, 게임에 들어가서 가장 먼저 보는 화면은 "캐릭터 만들기"다
        if (!SAVE.avatar.created) setTimeout(() => UI.showAvatarCustomizer(true), 420);
      },
    };

    /* =====================================================
     * A. 감성 오프닝 시퀀스 (타이핑 0.04초/글자 → 3초 여운 → 페이드)
     * ===================================================== */
    (function () {
      const LINES = [
        '당신이 진정 좋아하는 일이 무엇인지 알고 있나요?',
        '당신은 어떤 일을 하며 살아가고 싶나요?',
        '프로젝트 JOB에서 당신만의 진정한 커리어를 탐색해 보세요.',
      ];
      const ov = document.getElementById('opening');
      const line = document.getElementById('opening-line');
      const skip = document.getElementById('opening-skip');
      let li = 0, timer = null, hold = null, ended = false;
      for (let i = 0; i < 40; i++) {
        const d = document.createElement('span');
        d.className = 'op-dot';
        const z = Math.random() * 3 + 1.5;
        d.style.cssText = `width:${z}px;height:${z}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 3.2}s`;
        ov.appendChild(d);
      }
      function typeLine() {
        if (ended) return;
        if (li >= LINES.length) return end();
        const txt = LINES[li];
        line.textContent = '';
        line.classList.remove('op-out', 'op-done');
        line.classList.add('op-in');
        let i = 0;
        timer = setInterval(() => {
          i += 1;
          line.textContent = txt.slice(0, i);
          if (i >= txt.length) {
            clearInterval(timer);
            line.classList.add('op-done');
            hold = setTimeout(() => {
              line.classList.remove('op-in');
              line.classList.add('op-out');
              hold = setTimeout(() => { li += 1; typeLine(); }, 1050);
            }, 3000);
          }
        }, 40);
      }
      function end() {
        if (ended) return;
        ended = true;
        clearInterval(timer); clearTimeout(hold);
        document.removeEventListener('keydown', keyGuard, true);
        ov.style.transition = 'opacity .8s ease';
        ov.style.opacity = '0';
        setTimeout(() => { ov.remove(); TitleScreen.show(); }, 820);
      }
      function keyGuard(e) {
        if (ended) return;
        e.stopPropagation();
        if (['Enter', 'Escape', ' '].includes(e.key)) { e.preventDefault(); end(); }
      }
      document.addEventListener('keydown', keyGuard, true);
      skip.addEventListener('click', end);
      typeLine();
    })();

    /* =====================================================
     * B. 골드 경제 코어 — 누적 소비 추적 + 공용 부족 팝업
     * ===================================================== */
    UI.spendGold = function (amount) {
      SAVE.gold -= amount;
      SAVE.goldSpent = (SAVE.goldSpent || 0) + amount;
      Storage.save(SAVE);
      this.renderHeader();
    };
    UI.showGoldShort = function (name, price, backFn) {
      $('#modal-content').innerHTML = `
        <div class="text-center">
          <div class="text-5xl mb-3 anim-shake">💸</div>
          <h3 class="text-xl font-extrabold text-rose-500 mb-2">골드가 부족합니다!</h3>
          <p class="text-sm text-slate-500 mb-1"><b>${name}</b> — ${price}G</p>
          <p class="text-xs text-slate-400 mb-5">보유 ${SAVE.gold}G · <b class="text-rose-400">${price - SAVE.gold}G 부족</b><br/>직업을 완주하면 골드를 모을 수 있어요!</p>
          <button id="gold-short-ok" class="w-full py-3 rounded-xl font-bold bg-rose-500 text-white hover:bg-rose-600 transition">확인</button>
        </div>`;
      $('#gold-short-ok').onclick = backFn || (() => UI.closeModal());
      const g = $('#gold-display');
      g.classList.remove('anim-shake'); void g.offsetWidth; g.classList.add('anim-shake');
      setTimeout(() => g.classList.remove('anim-shake'), 700);
      UI.openModal();
    };

    /* =====================================================
     * C. 마이룸 상점 — 가구·장식 + 기능성 아이템 (골드 소모처)
     * ===================================================== */
    const SHOP_ITEMS = [
      { id: 'shop_tv',      emoji: '📺', name: '레트로 브라운관 TV', kind: 'furniture', jobName: '상점', price: 300, desc: '지지직— 감성은 화질순이 아니에요.' },
      { id: 'shop_piano',   emoji: '🎹', name: '그랜드 피아노',      kind: 'furniture', jobName: '상점', price: 400, desc: '한 곡 연주하면 방 분위기가 우아해져요.' },
      { id: 'shop_neon',    emoji: '🪩', name: '홈파티 미러볼',      kind: 'decor',     jobName: '상점', price: 250, desc: '켜는 순간 내 방이 클럽이 됩니다.' },
      { id: 'shop_plant',   emoji: '🪴', name: '몬스테라 화분',      kind: 'decor',     jobName: '상점', price: 150, desc: '초록이 하나로 공기까지 맑아지는 기분.' },
      { id: 'shop_jacuzzi', emoji: '🛁', name: '골드 자쿠지',        kind: 'furniture', jobName: '상점', price: 550, desc: '하루의 피로를 녹이는 최고의 사치.' },
      { id: 'shop_cat',     emoji: '🐈', name: '고양이 룸메이트',    kind: 'decor',     jobName: '상점', price: 600, desc: '가끔 가구를 긁지만… 귀여우니 무죄.' },
    ];
    const GOLD_KEY_PRICE = 1500, FASTPASS_PRICE = 800;

    const _origAllItems = RoomUI.allItems.bind(RoomUI);
    RoomUI.allItems = function () {
      return _origAllItems().concat(SHOP_ITEMS.filter((s) => SAVE.unlocked.includes(s.id)).map((s) => ({ ...s })));
    };

    UI.showRoomShop = function () {
      const fp = SAVE.fastpass || 0;
      const lockedThemes = THEMES.filter((t) => !t.always && !SAVE.unlocked.includes(t.id));
      const funcRows = `
        <div class="flex items-center gap-3 bg-gradient-to-r from-amber-50 to-yellow-50 border-2 border-amber-300 rounded-2xl p-3">
          <span class="text-3xl">🗝️</span>
          <div class="flex-1 min-w-0 text-left">
            <p class="text-sm font-extrabold text-slate-700">황금 열쇠 <span class="text-[9px] font-black px-1.5 py-0.5 rounded-full bg-amber-400 text-white">기능성</span></p>
            <p class="text-[11px] text-slate-500">잠긴 마이룸 배경 테마 1종을 퀘스트 없이 즉시 해금! (남은 잠금 테마 ${lockedThemes.length}종)</p>
          </div>
          <button onclick="UI.buyGoldKey()" ${lockedThemes.length ? '' : 'disabled'}
            class="text-xs font-black px-3 py-2 rounded-xl ${lockedThemes.length ? 'bg-amber-400 text-white hover:bg-amber-500' : 'bg-slate-200 text-slate-400 cursor-not-allowed'} transition shrink-0">${lockedThemes.length ? `💰 ${GOLD_KEY_PRICE}G` : '전부 해금됨'}</button>
        </div>
        <div class="flex items-center gap-3 bg-gradient-to-r from-violet-50 to-indigo-50 border-2 border-violet-300 rounded-2xl p-3">
          <span class="text-3xl">🎫</span>
          <div class="flex-1 min-w-0 text-left">
            <p class="text-sm font-extrabold text-slate-700">프리패스 면접권 <span class="text-[9px] font-black px-1.5 py-0.5 rounded-full bg-violet-500 text-white">기능성</span></p>
            <p class="text-[11px] text-slate-500">재취업·재도전 시 광고 시청을 1회 건너뜁니다. <b class="text-violet-500">보유 ${fp}장</b> (자동 사용)</p>
          </div>
          <button onclick="UI.buyFastpass()" class="text-xs font-black px-3 py-2 rounded-xl bg-violet-500 text-white hover:bg-violet-600 transition shrink-0">💰 ${FASTPASS_PRICE}G</button>
        </div>`;
      const furnRows = SHOP_ITEMS.map((it) => {
        const owned = SAVE.unlocked.includes(it.id);
        return `
          <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-2xl p-3">
            <span class="text-3xl">${it.emoji}</span>
            <div class="flex-1 min-w-0 text-left">
              <p class="text-sm font-extrabold text-slate-700">${it.name}
                <span class="text-[9px] font-black px-1.5 py-0.5 rounded-full ${it.kind === 'furniture' ? 'bg-sky-100 text-sky-600' : 'bg-pink-100 text-pink-600'}">${it.kind === 'furniture' ? '가구' : '장식'}</span></p>
              <p class="text-[11px] text-slate-400">${it.desc}</p>
            </div>
            ${owned
              ? '<span class="text-xs font-bold text-emerald-500 px-3 shrink-0">보유중 ✔</span>'
              : `<button onclick="UI.buyShopItem('${it.id}')" class="text-xs font-black px-3 py-2 rounded-xl bg-amber-400 text-white hover:bg-amber-500 transition shrink-0">💰 ${it.price}G</button>`}
          </div>`;
      }).join('');
      $('#modal-content').innerHTML = `
        <div class="text-center">
          <div class="text-4xl mb-2">🛒</div>
          <h3 class="text-xl font-extrabold text-slate-800 mb-1">인테리어 소품 상점</h3>
          <p class="text-xs text-slate-400 mb-1">직업 체험으로 모은 골드를 여기서 사용하세요! (누적 소비 ${SAVE.goldSpent || 0}G)</p>
          <p class="text-sm font-black text-amber-500 mb-4">보유 골드: ${SAVE.gold}G</p>
          <p class="text-[11px] font-black text-slate-400 uppercase tracking-wider text-left mb-1.5">⚡ 기능성 아이템</p>
          <div class="flex flex-col gap-2 mb-4 text-left">${funcRows}</div>
          <p class="text-[11px] font-black text-slate-400 uppercase tracking-wider text-left mb-1.5">🪑 가구 · 장식</p>
          <div class="flex flex-col gap-2 mb-4 text-left">${furnRows}</div>
          <button onclick="UI.closeModal()" class="w-full py-3 rounded-xl font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">닫기</button>
        </div>`;
      UI.openModal();
    };

    UI.buyShopItem = function (id) {
      const it = SHOP_ITEMS.find((s) => s.id === id);
      if (!it || SAVE.unlocked.includes(id)) return;
      if (SAVE.gold < it.price) { UI.showGoldShort(`${it.emoji} ${it.name}`, it.price, () => UI.showRoomShop()); return; }
      UI.spendGold(it.price);
      SAVE.unlocked.push(id);
      Storage.save(SAVE);
      RoomUI.render();
      UI.showRoomShop();
      UI.toast(`${it.emoji} ${it.name} 구매 완료! 인벤토리에서 배치해 보세요.`);
    };

    /* --- 🗝️ 황금 열쇠: 잠긴 테마 즉시 해금 --- */
    UI.buyGoldKey = function () {
      const locked = THEMES.filter((t) => !t.always && !SAVE.unlocked.includes(t.id));
      if (!locked.length) { UI.toast('이미 모든 테마를 해금했어요!'); return; }
      if (SAVE.gold < GOLD_KEY_PRICE) { UI.showGoldShort('🗝️ 황금 열쇠', GOLD_KEY_PRICE, () => UI.showRoomShop()); return; }
      $('#modal-content').innerHTML = `
        <div class="text-center">
          <div class="text-4xl mb-2">🗝️</div>
          <h3 class="text-lg font-extrabold text-slate-800 mb-1">어떤 테마를 해금할까요?</h3>
          <p class="text-xs text-slate-400 mb-4">황금 열쇠(${GOLD_KEY_PRICE}G)는 선택한 테마 1종에 사용됩니다.</p>
          <div class="grid grid-cols-2 gap-2 mb-4">
            ${locked.map((t) => `
              <button onclick="UI.useGoldKey('${t.id}')" class="relative rounded-xl h-20 border-2 border-amber-300 overflow-hidden hover:scale-[1.03] transition" style="background:${t.bg}">
                <span class="absolute inset-0 flex items-center justify-center text-xs font-black text-white bg-black/30">${t.emoji} ${t.name}</span>
              </button>`).join('')}
          </div>
          <button onclick="UI.showRoomShop()" class="w-full py-3 rounded-xl font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">돌아가기</button>
        </div>`;
      UI.openModal();
    };
    UI.useGoldKey = function (themeId) {
      const t = THEMES.find((x) => x.id === themeId);
      if (!t || SAVE.unlocked.includes(themeId)) return;
      if (SAVE.gold < GOLD_KEY_PRICE) { UI.showGoldShort('🗝️ 황금 열쇠', GOLD_KEY_PRICE, () => UI.showRoomShop()); return; }
      UI.spendGold(GOLD_KEY_PRICE);
      SAVE.unlocked.push(themeId);
      Storage.save(SAVE);
      RoomUI.render();
      UI.showRoomShop();
      UI.toast(`🗝️ 황금 열쇠로 ${t.emoji} ${t.name} 테마를 해금했어요!`);
    };

    /* --- 🎫 프리패스 면접권: 재취업 광고 스킵 --- */
    UI.buyFastpass = function () {
      if (SAVE.gold < FASTPASS_PRICE) { UI.showGoldShort('🎫 프리패스 면접권', FASTPASS_PRICE, () => UI.showRoomShop()); return; }
      UI.spendGold(FASTPASS_PRICE);
      SAVE.fastpass = (SAVE.fastpass || 0) + 1;
      Storage.save(SAVE);
      UI.showRoomShop();
      UI.toast(`🎫 프리패스 면접권 구매! (보유 ${SAVE.fastpass}장) 재취업 시 자동 사용됩니다.`);
    };
    const _rehire = UI.rehire.bind(UI);
    UI.rehire = function (jobId) {
      if (Engine.run) return;
      if ((SAVE.fastpass || 0) > 0) {
        SAVE.fastpass -= 1;
        delete SAVE.adGate[jobId];
        Storage.save(SAVE);
        UI.toast(`🎫 프리패스 면접권 사용! 광고 없이 바로 입사합니다. (남은 ${SAVE.fastpass}장)`);
        Engine.startRun(jobId);
        this.fx('fx-flash');
        this.switchTab('jobs');
        return;
      }
      _rehire(jobId);
    };
    const _pickPath = UI.pickPath.bind(UI);
    UI.pickPath = function (i) {
      const jobId = SAVE.board.jobIds[i];
      if (jobId && SAVE.adGate[jobId] && Date.now() < SAVE.adGate[jobId] && (SAVE.fastpass || 0) > 0) {
        SAVE.fastpass -= 1;
        delete SAVE.adGate[jobId];
        Storage.save(SAVE);
        UI.toast(`🎫 프리패스 면접권 사용! 광고 없이 재도전합니다. (남은 ${SAVE.fastpass}장)`);
      }
      _pickPath(i);
    };
    /* 방 확장 골드 결제도 누적 소비에 포함 */
    RoomUI.expandWithGold = function () {
      if (SAVE.gold < this.EXPAND_COST) return;
      UI.spendGold(this.EXPAND_COST);
      this.completeExpand(`💰 ${this.EXPAND_COST}G를 사용해 방을 확장했어요!`);
    };

    /* =====================================================
     * D. 스페셜 전문 진로 분석 리포트 (누적 소비 or 보유 5,000G 해금)
     * ===================================================== */
    const REPORT_GATE = 5000;
    const TRAIT_CLUSTERS = {
      analytical: ['📊 데이터·전략 직군', '숫자 뒤의 진실을 읽는 당신, 데이터 분석가·전략기획·리서처 계열에서 강점이 폭발합니다.'],
      creativity: ['🎨 크리에이티브 직군', '남들이 못 보는 각도를 찾아내는 당신, 기획·디자인·콘텐츠 제작 계열이 놀이터가 됩니다.'],
      teamwork: ['🤝 대인·조직 직군', '사람 사이의 온도를 조절할 줄 아는 당신, 교육·의료·서비스·매니지먼트 계열의 재목입니다.'],
      risk: ['🚀 도전·개척 직군', '불확실성 앞에서 오히려 눈이 반짝이는 당신, 창업·영업·신사업 계열에 어울립니다.'],
      perfection: ['🛡️ 정밀·전문 직군', '한 끗의 오차도 허투루 넘기지 않는 당신, 법률·의료·품질·안전 계열에서 신뢰를 얻습니다.'],
      patience: ['🌳 장인·연구 직군', '긴 호흡으로 완성하는 힘을 가진 당신, 연구·장인·농업·집필 계열에서 빛납니다.'],
      speed: ['⚡ 현장·실전 직군', '판단과 실행 사이가 짧은 당신, 응급·현장 대응·운영 계열의 에이스 감입니다.'],
      modern: ['🔮 테크·혁신 직군', '새 도구를 먼저 집어 드는 당신, IT·신기술·미디어 계열의 얼리어답터형 인재입니다.'],
      eco: ['🌿 자연·환경 직군', '지속가능함의 가치를 아는 당신, 농업·환경·동물 케어 계열과 궁합이 좋습니다.'],
    };
    const _renderAnalysis = UI.renderAnalysis.bind(UI);
    UI.renderAnalysis = function () {
      _renderAnalysis();
      const box = document.querySelector('#special-report');
      if (!box) return;
      const spent = SAVE.goldSpent || 0;
      const open = spent >= REPORT_GATE || SAVE.gold >= REPORT_GATE;
      if (!open) {
        const best = Math.max(spent, SAVE.gold);
        const pct = Math.min(100, Math.round((best / REPORT_GATE) * 100));
        box.innerHTML = `
          <div class="mt-3 rounded-3xl border-2 border-dashed border-amber-300 bg-amber-50/60 p-5 text-center">
            <p class="text-3xl mb-1">🔒💎</p>
            <p class="font-extrabold text-slate-700">스페셜 전문 진로 분석 리포트</p>
            <p class="text-xs text-slate-500 mt-1 mb-3">골드를 <b>누적 ${REPORT_GATE}G 소비</b>하거나 <b>${REPORT_GATE}G 보유</b>하면 열리는 프리미엄 심층 리포트입니다.<br/>다양한 직업을 완주하고 상점을 이용해 보세요!</p>
            <div class="max-w-xs mx-auto h-3 bg-white border border-amber-200 rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-gradient-to-r from-amber-300 to-amber-500 transition-all" style="width:${pct}%"></div>
            </div>
            <p class="text-[11px] font-black text-amber-500 mt-1.5">${best}G / ${REPORT_GATE}G (${pct}%)</p>
          </div>`;
        return;
      }
      const traits = {};
      for (const h of SAVE.history) {
        for (const [k, v] of Object.entries((h.stats && h.stats.traits) || {})) {
          if (v > 0) traits[k] = (traits[k] || 0) + v;
        }
      }
      const sorted = Object.entries(traits).sort((a, b) => b[1] - a[1]);
      if (!sorted.length) {
        box.innerHTML = `
          <div class="mt-3 rounded-3xl border-2 border-amber-300 bg-white p-5 text-center">
            <p class="text-3xl mb-1">💎</p>
            <p class="font-extrabold text-slate-700">스페셜 리포트 해금 완료!</p>
            <p class="text-xs text-slate-400 mt-1">아직 분석할 플레이 데이터가 없어요. 직업을 플레이하면 심층 리포트가 채워집니다.</p>
          </div>`;
        return;
      }
      const [t1] = sorted[0];
      const t2 = (sorted[1] || sorted[0])[0];
      const c1 = TRAIT_CLUSTERS[t1] || TRAIT_CLUSTERS.teamwork;
      const c2 = TRAIT_CLUSTERS[t2] || TRAIT_CLUSTERS.patience;
      const uv = Similar.userVec();
      const top5 = getAllJobs()
        .map((j) => ({ j, sim: uv ? Similar.cos(uv, Similar.jobVec(j)) : 0 }))
        .sort((a, b) => b.sim - a.sim).slice(0, 5);
      const top5Html = top5.map((x, i) => `
        <div class="flex items-center gap-2.5 text-xs">
          <span class="w-5 font-black text-amber-400">${i + 1}</span>
          <span class="text-lg">${x.j.emoji}</span>
          <span class="w-24 font-extrabold text-slate-600 truncate">${x.j.name}</span>
          <div class="flex-1 h-3 bg-slate-100 rounded-full overflow-hidden"><div class="trait-bar h-full rounded-full bg-gradient-to-r from-amber-300 to-amber-500" style="width:${Math.round(x.sim * 100)}%;animation-delay:${i * 100}ms"></div></div>
          <span class="w-10 text-right font-black text-amber-500">${Math.round(x.sim * 100)}%</span>
        </div>`).join('');
      const bestJob = top5[0] ? top5[0].j.name : '탐색 중';
      box.innerHTML = `
        <div class="mt-3 rounded-3xl overflow-hidden border-2 border-amber-300 bg-white">
          <div class="bg-gradient-to-r from-amber-400 to-yellow-500 px-6 py-4 text-white">
            <p class="text-[10px] font-black tracking-[0.25em] uppercase opacity-90">Premium Career Report</p>
            <h3 class="text-lg font-black">💎 스페셜 전문 진로 분석 리포트</h3>
            <p class="text-[11px] opacity-90">골드 이코노미 우수 플레이어 전용 · 누적 소비 ${spent}G · 보유 ${SAVE.gold}G</p>
          </div>
          <div class="p-5 flex flex-col gap-4">
            <div class="rounded-2xl bg-amber-50 border border-amber-200 p-4">
              <p class="text-[11px] font-black text-amber-500 uppercase tracking-wider mb-1">핵심 직군 매칭</p>
              <p class="text-sm font-extrabold text-slate-700 mb-1">${c1[0]}</p>
              <p class="text-xs text-slate-500 leading-relaxed">${c1[1]}</p>
              <p class="text-sm font-extrabold text-slate-700 mt-3 mb-1">${c2[0]} <span class="text-[10px] font-bold text-slate-400">(보조 성향)</span></p>
              <p class="text-xs text-slate-500 leading-relaxed">${c2[1]}</p>
            </div>
            <div>
              <p class="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2">정밀 적합도 TOP 5</p>
              <div class="flex flex-col gap-2 bg-slate-50 rounded-2xl p-4">${top5Html}</div>
            </div>
            <div>
              <p class="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2">커리어 로드맵 제안</p>
              <div class="flex flex-col gap-1.5 text-xs text-slate-600">
                <p>🌱 <b>단기</b> — #${TRAIT_LABELS[t1] || t1} 강점을 살릴 수 있는 <b>${bestJob}</b> 심화(리얼 모드) 완주에 도전하세요.</p>
                <p>🌿 <b>중기</b> — 보조 성향 #${TRAIT_LABELS[t2] || t2}를 키울 수 있는 직군을 2~3개 더 체험하며 스펙트럼을 넓히세요.</p>
                <p>🌳 <b>장기</b> — 적합도 상위 직군의 자격·전망 정보를 가이드북에서 확인하고 현실 로드맵으로 연결하세요.</p>
              </div>
            </div>
            <p class="text-[10px] text-slate-300 text-center">* 본 리포트는 게임 내 선택 데이터 기반 시뮬레이션이며, 플레이할수록 정밀해집니다.</p>
          </div>
        </div>`;
    };

    /* =====================================================
     * E. 캐릭터 커스터마이저 — 좌우 화살표(◀▶) 파츠 사이클 업그레이드
     * ===================================================== */
    UI.cycleAvatar = function (key, dir) {
      const d = this._draft;
      if (key === 'costume') {
        const list = [null, ...getAllJobs().filter((j) => j.costume && SAVE.unlocked.includes(j.costume.id)).map((j) => j.costume.id)];
        const cur = Math.max(0, list.indexOf(d.costume));
        const next = list[(cur + dir + list.length) % list.length];
        this.pickAvatar('costume', next === null ? 'null' : next);
        return;
      }
      const lens = { skin: AvatarSVG.SKINS.length, hair: AvatarSVG.HAIRS.length, hairColor: AvatarSVG.HAIR_COLORS.length, outfit: AvatarSVG.OUTFITS.length };
      this.pickAvatar(key, ((d[key] || 0) + dir + lens[key]) % lens[key]);
    };
    UI.renderCustomizer = function (firstRun = false) {
      const d = this._draft;
      const arrowRow = (key, label, valueName, extra = '') => `
        <div>
          <p class="text-[11px] font-black text-slate-400 uppercase mb-1.5">${label}</p>
          <div class="flex items-center gap-2">
            <button onclick="UI.cycleAvatar('${key}',-1)" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-indigo-100 text-slate-600 font-black transition shrink-0">◀</button>
            <p class="flex-1 text-center text-sm font-extrabold text-slate-700 bg-slate-50 border border-slate-200 rounded-xl py-2 truncate">${valueName}</p>
            <button onclick="UI.cycleAvatar('${key}',1)" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-indigo-100 text-slate-600 font-black transition shrink-0">▶</button>
          </div>
          ${extra}
        </div>`;
      const swatch = (list, key, names) => `
        <div class="flex gap-1.5 flex-wrap mt-1.5 justify-center">
          ${list.map((v, i) => `
            <button onclick="UI.pickAvatar('${key}',${i})" title="${names ? names[i] : ''}"
              class="w-7 h-7 rounded-full border-2 transition ${d[key] === i ? 'border-indigo-500 ring-2 ring-indigo-200 scale-110' : 'border-slate-200 hover:border-indigo-300'}"
              style="background:${v}"></button>`).join('')}
        </div>`;
      const costume = AvatarSVG.costumeOf(d.costume);
      const costumeName = costume ? `${costume.emoji} ${costume.name}` : '👕 기본 의상';
      const unlockedCostumes = getAllJobs().filter((j) => j.costume && SAVE.unlocked.includes(j.costume.id)).length;
      $('#modal-content').innerHTML = `
        <div>
          ${firstRun ? '<p class="text-xs font-bold tracking-widest uppercase text-indigo-500 text-center mb-1">Welcome to ProjectJOB!</p>' : ''}
          <h3 class="text-lg font-extrabold text-slate-800 text-center mb-3">${firstRun ? '나만의 캐릭터를 만들어 보세요!' : '🧑‍🎨 캐릭터 꾸미기'}</h3>
          <div class="flex justify-center mb-3 bg-gradient-to-b from-indigo-50 to-pink-50 rounded-2xl py-4">${AvatarSVG.render(d, 110)}</div>
          <div class="flex flex-col gap-3 mb-4">
            ${arrowRow('skin', '피부', AvatarSVG.SKIN_NAMES[d.skin % AvatarSVG.SKINS.length], swatch(AvatarSVG.SKINS, 'skin', AvatarSVG.SKIN_NAMES))}
            ${arrowRow('hair', '헤어스타일', AvatarSVG.HAIRS[d.hair % AvatarSVG.HAIRS.length])}
            ${arrowRow('hairColor', '머리 색', AvatarSVG.HAIR_COLOR_NAMES[d.hairColor % AvatarSVG.HAIR_COLORS.length], swatch(AvatarSVG.HAIR_COLORS, 'hairColor', AvatarSVG.HAIR_COLOR_NAMES))}
            ${arrowRow('outfit', '기본 의상 색', AvatarSVG.OUTFIT_NAMES[d.outfit % AvatarSVG.OUTFITS.length], swatch(AvatarSVG.OUTFITS, 'outfit', AvatarSVG.OUTFIT_NAMES))}
            ${arrowRow('costume', `코스튬 <span class="font-medium normal-case">(성공 엔딩 해금 · ${unlockedCostumes}종 보유)</span>`, costumeName)}
            <div>
              <p class="text-[11px] font-black text-slate-400 uppercase mb-1.5">닉네임</p>
              <input id="nick-input" value="${SAVE.nickname}" maxlength="12"
                class="w-full text-sm font-bold border-2 border-slate-200 rounded-xl px-3 py-2 focus:border-indigo-300 outline-none"/>
            </div>
          </div>
          <button onclick="UI.saveAvatar()" class="w-full py-3 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition mb-2">${firstRun ? '이 모습으로 시작하기!' : '저장하기'}</button>
          ${firstRun ? '' : '<button onclick="UI.closeModal()" class="w-full py-3 rounded-xl font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">취소</button>'}
        </div>`;
    };

    /* =====================================================
     * F. 마이룸 가구 겹침(충돌) 방지 — 배치·이동 공통
     * ===================================================== */
    RoomUI.findCollision = function (id, x, y) {
      for (const [oid, pos] of Object.entries(this.wallItems())) {
        if (oid === id) continue;
        if (Math.abs(pos.x - x) < 9 && Math.abs(pos.y - y) < 13) return oid;
      }
      return null;
    };
    const _placeOrig = RoomUI.place.bind(RoomUI);
    RoomUI.place = function (id, x, y) {
      const hit = this.findCollision(id, x, y);
      if (hit) {
        UI.toast('💥 이미 가구가 있는 자리예요! 다른 곳에 놓아주세요.');
        const el = document.querySelector(`[data-item="${hit}"]`);
        if (el) { el.classList.remove('collide-shake'); void el.offsetWidth; el.classList.add('collide-shake'); }
        this.renderInventory();
        return;
      }
      _placeOrig(id, x, y);
    };
    RoomUI.dragStart = function (e, id) {
      e.preventDefault();
      const room = document.querySelector('#room-2d');
      const el = room.querySelector(`[data-item="${id}"]`);
      const orig = { ...(this.wallItems()[id] || { x: 50, y: 60 }) };
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      this._drag = { id, el, room };
      el.onpointermove = (ev) => {
        if (!this._drag) return;
        const r = room.getBoundingClientRect();
        const x = Math.min(94, Math.max(4, ((ev.clientX - r.left) / r.width) * 100));
        const y = Math.min(90, Math.max(12, ((ev.clientY - r.top) / r.height) * 100));
        el.style.left = x + '%';
        el.style.top = y + '%';
      };
      el.onpointerup = (ev) => {
        if (!this._drag) return;
        el.classList.remove('dragging');
        const r = room.getBoundingClientRect();
        const x = Math.min(94, Math.max(4, ((ev.clientX - r.left) / r.width) * 100));
        const y = Math.min(90, Math.max(12, ((ev.clientY - r.top) / r.height) * 100));
        this._drag = null;
        el.onpointermove = el.onpointerup = null;
        if (this.findCollision(id, x, y)) {
          // ★ 충돌! 부르르 떨림 + 원위치 복귀 (저장하지 않음)
          UI.toast('💥 겹칠 수 없어요! 원래 자리로 되돌립니다.');
          el.style.left = orig.x + '%';
          el.style.top = orig.y + '%';
          el.classList.remove('collide-shake'); void el.offsetWidth; el.classList.add('collide-shake');
          setTimeout(() => el.classList.remove('collide-shake'), 600);
          return;
        }
        SAVE.room.walls[SAVE.room.wall][id] = { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
        Storage.save(SAVE);
      };
    };

    /* =====================================================
     * G. 마이룸 편집 모드 ON/OFF (충돌 방지 오버라이드 이후에 래핑)
     * ===================================================== */
    RoomUI._edit = true;
    RoomUI.toggleEdit = function () {
      this._edit = !this._edit;
      const btn = document.querySelector('#edit-toggle');
      btn.textContent = this._edit ? '🔓 편집 ON' : '🔒 편집 OFF';
      btn.className = this._edit
        ? 'text-xs font-bold px-3 py-2 rounded-xl bg-emerald-500 text-white hover:bg-emerald-600 transition'
        : 'text-xs font-bold px-3 py-2 rounded-xl bg-slate-300 text-slate-600 hover:bg-slate-400 transition';
      UI.toast(this._edit ? '🔓 편집 모드 ON — 가구를 자유롭게 배치하세요!' : '🔒 편집 모드 OFF — 방을 감상 중이에요. (배치 잠금)');
    };
    ['place', 'autoPlace', 'pickUp', 'dragStart'].forEach((fn) => {
      const orig = RoomUI[fn].bind(RoomUI);
      RoomUI[fn] = function (...args) {
        if (!this._edit) { UI.toast('🔒 편집 모드가 꺼져 있어요. [편집 ON]을 눌러주세요!'); return; }
        return orig(...args);
      };
    });
  </script>
</body>
</html>
